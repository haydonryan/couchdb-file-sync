[package]
name = "couchdb-file-sync"
version = "0.3.0"
edition = "2021"
description = "Filesystem-to-CouchDB sync engine with bidirectional sync and conflict detection"
authors = ["Nina Těšková <nina.marie.teskova@gmail.com>"]
license = "MIT"
repository = "https://gitea.hnrglobal.com/HNR-Global/couchdb-file-sync"

[[bin]]
name = "couchdb-file-sync"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
tokio-util = "0.7"

# CouchDB client
couch_rs = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9.42"

# CLI
clap = { version = "4.6", features = ["derive", "env"] }
dialoguer = "0.12"

# Diff
similar = "3.1"

# Configuration
config = "0.15"

# File watching
notify-debouncer-full = "0.7"

# SQLite
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }

# Hashing
sha2 = "0.11"
hex = "0.4"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Pattern matching for ignore files
globset = "0.4"

# HTTP client for Telegram
reqwest = { version = "0.13.4", features = ["json", "query"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Path utilities
walkdir = "2.5"

# Random generation
rand = "0.10.2"

[dev-dependencies]
tempfile = "3.27"
tokio-test = "0.4"

[package.metadata.release]
allow-branch = ["main", "master"]
sign-commit = false
sign-tag = false
push = true
tag = true
publish = false
tag-name = "v{{version}}"
tag-message = "release: v{{version}}"
pre-release-commit-message = "release: v{{version}}"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
